          "name": "How much does one unit of electricity cost in Pakistan?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "In Pakistan, electricity per-unit cost is calculated in two distinct ways: 1) Without Taxes (Base Price): Base electricity cost divided by total units, reflecting your pure NEPRA slab tariff under SRO 575(I)/2024. 2) All-Inclusive Effective Rate: Total bill payable divided by total units consumed. Because Pakistani bills include 18% GST, 1.5% Electricity Duty, Rs. 3.23/unit Financing Cost Surcharge, Fuel Price Adjustment (FPA), and Quarterly Tariff Adjustment (QTA), government taxes add a 35% to 55% overhead on top of the base slab cost."
          }
        },
        {
          "@type": "Question",
          "name": "Why do I still get an electricity bill even though I have solar net-metering?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Under NEPRA Net-Metering Regulations (SRO 892(I)/2015), solar owners receive a bill for 5 statutory reasons: 1) Peak Hours Exclusion: Solar generates only during daylight (Off-Peak); evening Peak hours (5 PM - 11 PM) cannot be offset by daytime export units and are billed at full peak rates (~Rs. 41.89/kWh). 2) Fixed charges on sanctioned load (kW). 3) Mandatory non-offsettable fees (PTV fee Rs. 35, Electricity Duty). 4) High nighttime or winter import exceeding solar export. 5) Surplus units are settled at the end of each quarter at the national buyback rate (Rs. 22/unit)."
          }
        },
        {
          "@type": "Question",
          "name": "What is a Protected electricity consumer in Pakistan (200 Units Rule)?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Under Ministry of Energy notification SRO 575(I)/2024, residential consumers qualify as Protected only if monthly electricity consumption has remained 200 units or less for 6 consecutive months. Exceeding 200 units in even one month triggers higher Unprotected progressive slabs."
          }
        },
        {
          "@type": "Question",
          "name": "What is Fuel Price Adjustment (FPA) on Pakistani electricity bills?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Fuel Price Adjustment (FPA) is a monthly statutory surcharge governed by Section 31(7) of the NEPRA Act. It represents the variance between reference fuel costs set in the annual base tariff and actual fuel expenditures incurred by CPPA-G to generate electricity."
          }
        },
